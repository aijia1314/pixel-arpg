<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<title>我居然是副本BOSS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #rotate-hint {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92); z-index: 10;
    justify-content: center; align-items: center;
    flex-direction: column;
    pointer-events: none;
  }
  #rotate-hint .icon { font-size: 56px; animation: spin 1.5s ease-in-out infinite alternate; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(90deg); } }
  #rotate-hint .text { color: #fff; font: bold 20px "Microsoft YaHei",sans-serif; margin-top: 16px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate-hint">
  <div class="icon">📱</div>
  <div class="text">请旋转手机至横屏</div>
</div>

<script>
// ============================================================
//  像素近战 ARPG v4
//  代码手绘像素角色 + 浮动摇杆 + Lerp平滑 + 横屏全屏 + 街霸级打击感
// ============================================================

// ---------- 固定内部分辨率（像素风） ----------
var GW = 480;
var GH = 270;

// ---------- DOM ----------
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

var rotateHint = document.getElementById('rotate-hint');

var offscreen = document.createElement('canvas');
offscreen.width  = GW;
offscreen.height = GH;
var g = offscreen.getContext('2d');
g.imageSmoothingEnabled = false;

// 屏幕尺寸 & 缩放（v1 letterbox 方案，已验证可用）
var sw = window.innerWidth  || 375;
var sh = window.innerHeight || 667;
var scale = 1;
var ox = 0, oy = 0;
var isLandscape = true;

function resize() {
  sw = window.innerWidth  || 375;
  sh = window.innerHeight || 667;
  isLandscape = sw > sh;

  // 竖屏时显示旋转提示，隐藏游戏画布
  if (!isLandscape) {
    rotateHint.style.display = 'flex';
    canvas.style.display = 'none';
    return;
  }
  rotateHint.style.display = 'none';
  canvas.style.display = 'block';

  canvas.width  = sw;
  canvas.height = sh;
  // ★ 横屏全屏铺满：cover 模式
  scale = Math.max(sw / GW, sh / GH);
  ox = (sw - GW * scale) / 2;
  oy = (sh - GH * scale) / 2;
  ctx.imageSmoothingEnabled = false;
  recalcUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function() { setTimeout(resize, 120); });
resize();

// 尝试锁定横屏（需要用户手势 + 全屏）
function tryLockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(function(){});
  }
}
canvas.addEventListener('click', tryLockLandscape);
canvas.addEventListener('touchstart', tryLockLandscape, { once: true });

// ============================================================
//  游戏状态
// ============================================================
var player = {
  x: GW/2, y: GH/2,
  w: 18, h: 22,
  speed: 100,
  vx: 0, vy: 0,
  facing: 0,
  walkFrame: 0,
  attackCD: 0, attackTimer: 0,
  skillCD: 0,
  isDashing: false, dashTimer: 0, dashDx: 0, dashDy: 0,
  hp: 100,
  invincible: 0, hitstop: 0, hurtFlash: 0,
};

var enemies = [];
var particles = [];
var screenShake = 0, shakeX = 0, shakeY = 0;

// 输入状态
var joystick = {
  active: false, touchId: null,
  baseX: 0, baseY: 0, stickX: 0, stickY: 0,
  dx: 0, dy: 0,
};

var atkBtn   = { pressed: false, touchId: null };
var skillBtn = { pressed: false, touchId: null };

var attackJustPressed = false;
var skillJustPressed  = false;

var respawnQueue = [];
var MAX_ENEMIES = 3;
var gameOver = false, gameOverTimer = 0;

// ---------- 副本防守战状态 ----------
// 这一版使用固定阵地，先验证「自动防守 + BOSS手操」循环。
var dungeon = {
  crystals: 120,
  wave: 1,
  kills: 0,
  minions: [
    { x: 135, y: 105, hp: 42, maxHp: 42, cd: 0 },
    { x: 330, y: 165, hp: 42, maxHp: 42, cd: 0 }
  ],
  traps: [
    { x: 220, y: 92, cd: 0 },
    { x: 285, y: 190, cd: 0 }
  ]
};

// ============================================================
//  动态 UI 尺寸
// ============================================================
var JOY_RADIUS   = 55;
var BTN_RADIUS_L = 48;
var BTN_RADIUS_S = 36;
var atkCX, atkCY, skillCX, skillCY, joyBaseX, joyBaseY;

function recalcUI() {
  var ref = Math.min(sw, sh);
  JOY_RADIUS   = Math.round(ref * 0.12);
  BTN_RADIUS_L = Math.round(ref * 0.105);
  BTN_RADIUS_S = Math.round(ref * 0.078);
  var m = Math.round(ref * 0.04);
  atkCX   = sw - BTN_RADIUS_L - m;
  atkCY   = sh - BTN_RADIUS_L - m;
  skillCX = sw - BTN_RADIUS_L - BTN_RADIUS_S * 2 - m * 3;
  skillCY = sh - BTN_RADIUS_S  - m * 1.5;
  joyBaseX = JOY_RADIUS + m;
  joyBaseY = sh - JOY_RADIUS - m;
}

// ============================================================
//  敌人
// ============================================================
function spawnEnemy() {
  var ex, ey;
  var m = 30;
  var s = Math.floor(Math.random() * 4);
  if      (s === 0) { ex = m;            ey = Math.random() * GH; }
  else if (s === 1) { ex = GW - m;       ey = Math.random() * GH; }
  else if (s === 2) { ex = Math.random() * GW; ey = m; }
  else              { ex = Math.random() * GW; ey = GH - m; }
  if (Math.hypot(ex - player.x, ey - player.y) < 60) {
    ex = clamp((ex + GW/2) % GW, m, GW - m);
    ey = clamp((ey + GH/2) % GH, m, GH - m);
  }
  return {
    x: ex, y: ey, w: 16, h: 16,
    hp: 50, maxHp: 50,
    speed: 40 + Math.random() * 25,
    stun: 0, hitstop: 0, flashTimer: 0,
    knockbackVx: 0, knockbackVy: 0,
    bounceT: Math.random() * Math.PI * 2,
    colorVar: Math.floor(Math.random() * 3),
  };
}
for (var i = 0; i < MAX_ENEMIES; i++) enemies.push(spawnEnemy());

// ============================================================
//  粒子
// ============================================================
function spawnSparks(x, y, count, color) {
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2;
    var spd = 60 + Math.random() * 200;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 0.10 + Math.random() * 0.12,
      maxLife: 0.22,
      color: color || '#ffdd44',
      size: 1.5 + Math.random() * 3.5,
    });
  }
}

// ============================================================
//  辅助
// ============================================================
function dist(a, b)  { return Math.hypot(a.x - b.x, a.y - b.y); }
function angleTo(a,b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function clamp(v,l,h) { return v < l ? l : (v > h ? h : v); }

// ============================================================
//  输入 — 触摸（v2 浮动摇杆）
// ============================================================
function inJoyZone(x) { return x < sw * 0.55; }

function hitButton(x, y) {
  if (Math.hypot(x - atkCX, y - atkCY) < BTN_RADIUS_L * 1.3)   return 'atk';
  if (Math.hypot(x - skillCX, y - skillCY) < BTN_RADIUS_S * 1.3) return 'skill';
  return null;
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (inJoyZone(t.clientX)) {
      if (joystick.touchId === null) {
        joystick.touchId = t.identifier;
        joystick.active  = true;
        joystick.baseX = joystick.stickX = t.clientX;
        joystick.baseY = joystick.stickY = t.clientY;
        joystick.dx = 0; joystick.dy = 0;
      }
    } else {
      var btn = hitButton(t.clientX, t.clientY);
      if (btn === 'atk' && atkBtn.touchId === null) {
        atkBtn.touchId = t.identifier; atkBtn.pressed = true; attackJustPressed = true;
      } else if (btn === 'skill' && skillBtn.touchId === null) {
        skillBtn.touchId = t.identifier; skillBtn.pressed = true; skillJustPressed = true;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier !== joystick.touchId) continue;
    var dx = t.clientX - joystick.baseX;
    var dy = t.clientY - joystick.baseY;
    var d = Math.hypot(dx, dy);
    if (d > JOY_RADIUS) {
      var nx = dx / d, ny = dy / d;
      joystick.baseX = t.clientX - nx * JOY_RADIUS;
      joystick.baseY = t.clientY - ny * JOY_RADIUS;
      joystick.stickX = t.clientX;
      joystick.stickY = t.clientY;
      joystick.dx = nx; joystick.dy = ny;
    } else {
      joystick.stickX = t.clientX; joystick.stickY = t.clientY;
      joystick.dx = dx / JOY_RADIUS; joystick.dy = dy / JOY_RADIUS;
    }
  }
}, { passive: false });

function releaseTouch(id) {
  if (id === joystick.touchId) {
    joystick.touchId = null; joystick.active = false;
    joystick.dx = 0; joystick.dy = 0;
    joystick.baseX = joystick.stickX = joyBaseX;
    joystick.baseY = joystick.stickY = joyBaseY;
  }
  if (id === atkBtn.touchId)   { atkBtn.touchId = null;   atkBtn.pressed = false; }
  if (id === skillBtn.touchId) { skillBtn.touchId = null; skillBtn.pressed = false; }
}

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) releaseTouch(e.changedTouches[i].identifier);
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
  for (var i = 0; i < e.changedTouches.length; i++) releaseTouch(e.changedTouches[i].identifier);
});

// ---- 鼠标 ----
canvas.addEventListener('mousedown', function(e) {
  if (inJoyZone(e.clientX)) {
    joystick.active = true;
    joystick.baseX = joystick.stickX = e.clientX;
    joystick.baseY = joystick.stickY = e.clientY;
    joystick.dx = 0; joystick.dy = 0;
  } else {
    var btn = hitButton(e.clientX, e.clientY);
    if (btn === 'atk')   { atkBtn.pressed = true;   attackJustPressed = true; }
    if (btn === 'skill') { skillBtn.pressed = true; skillJustPressed  = true; }
  }
});
canvas.addEventListener('mousemove', function(e) {
  if (!joystick.active || joystick.touchId !== null) return;
  var dx = e.clientX - joystick.baseX;
  var dy = e.clientY - joystick.baseY;
  var d = Math.hypot(dx, dy);
  if (d > JOY_RADIUS) {
    var nx = dx / d, ny = dy / d;
    joystick.baseX = e.clientX - nx * JOY_RADIUS;
    joystick.baseY = e.clientY - ny * JOY_RADIUS;
    joystick.stickX = e.clientX; joystick.stickY = e.clientY;
    joystick.dx = nx; joystick.dy = ny;
  } else {
    joystick.stickX = e.clientX; joystick.stickY = e.clientY;
    joystick.dx = dx / JOY_RADIUS; joystick.dy = dy / JOY_RADIUS;
  }
});
canvas.addEventListener('mouseup', function() {
  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
  atkBtn.pressed = false; skillBtn.pressed = false;
});

// ============================================================
//  伤害
// ============================================================
function applyDamage(enemy, damage, attackAngle) {
  if (enemy.hp <= 0) return;
  enemy.hp -= damage;
  enemy.flashTimer = 0.1;
  enemy.stun = 0.2;
  enemy.hitstop = 0.08;
  var f = 180;
  enemy.knockbackVx = Math.cos(attackAngle) * f;
  enemy.knockbackVy = Math.sin(attackAngle) * f;
  player.hitstop = 0.08;
  screenShake = 0.1;
  spawnSparks(enemy.x, enemy.y, 10, '#ffdd44');
  spawnSparks(enemy.x, enemy.y, 5, '#ffffff');
  if (enemy.hp <= 0) {
    spawnSparks(enemy.x, enemy.y, 20, '#ff6644');
    spawnSparks(enemy.x, enemy.y, 10, '#ffaa00');
    respawnQueue.push({ timer: 2.0 });
    dungeon.crystals += 18;
    dungeon.kills++;
  }
}

function updateDungeonDefense(dt) {
  // 地刺：挑战者经过时自动触发。
  for (var ti = 0; ti < dungeon.traps.length; ti++) {
    var tr = dungeon.traps[ti];
    if (tr.cd > 0) { tr.cd -= dt; continue; }
    for (var ei = 0; ei < enemies.length; ei++) {
      var target = enemies[ei];
      if (target.hp > 0 && Math.hypot(target.x-tr.x, target.y-tr.y) < 23) {
        applyDamage(target, 16, Math.atan2(target.y-tr.y, target.x-tr.x));
        tr.cd = 1.3;
        break;
      }
    }
  }
  // 史莱姆守卫：自动寻找最近挑战者，近距离攻击。
  for (var mi = 0; mi < dungeon.minions.length; mi++) {
    var mn = dungeon.minions[mi];
    if (mn.hp <= 0) continue;
    if (mn.cd > 0) mn.cd -= dt;
    var nearest = null, best = 64;
    for (var mj = 0; mj < enemies.length; mj++) {
      var foe = enemies[mj];
      var md = Math.hypot(foe.x-mn.x, foe.y-mn.y);
      if (foe.hp > 0 && md < best) { best = md; nearest = foe; }
    }
    if (nearest && mn.cd <= 0) {
      applyDamage(nearest, 9, Math.atan2(nearest.y-mn.y, nearest.x-mn.x));
      mn.cd = 0.85;
    }
  }
}

function performAttack() {
  var arcAngle = Math.PI * 2 / 3;
  var range = 38;
  for (var i = 0; i < enemies.length; i++) {
    var en = enemies[i];
    if (en.hp <= 0 || en.hitstop > 0) continue;
    if (dist(player, en) > range) continue;
    var ad = angleTo(player, en) - player.facing;
    while (ad > Math.PI)  ad -= Math.PI * 2;
    while (ad < -Math.PI) ad += Math.PI * 2;
    if (Math.abs(ad) < arcAngle / 2) applyDamage(en, 25, player.facing);
  }
}

function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
//  核心更新（v2 Lerp 平滑移动）
// ============================================================
function update(dt) {
  dt = Math.min(dt, 0.1);

  if (gameOver) { gameOverTimer -= dt; updateParticles(dt); return; }
  if (player.hp <= 0) {
    player.hp = 0; gameOver = true; gameOverTimer = 3.0;
    spawnSparks(player.x, player.y, 30, '#ff4444');
    spawnSparks(player.x, player.y, 20, '#ffaa00');
    spawnSparks(player.x, player.y, 10, '#ffffff');
    screenShake = 0.3; return;
  }

  // 重生
  for (var i = respawnQueue.length - 1; i >= 0; i--) {
    respawnQueue[i].timer -= dt;
    if (respawnQueue[i].timer <= 0) { enemies.push(spawnEnemy()); respawnQueue.splice(i, 1); }
  }

  // 震屏
  if (screenShake > 0) {
    screenShake -= dt;
    shakeX = (Math.random() - 0.5) * 10;
    shakeY = (Math.random() - 0.5) * 10;
  } else { shakeX = 0; shakeY = 0; }

  // 打击停顿
  var playerFrozen = player.hitstop > 0;
  if (playerFrozen) player.hitstop -= dt;

  // 冷却
  if (player.attackCD > 0) player.attackCD -= dt;
  if (player.skillCD  > 0) player.skillCD  -= dt;
  if (player.invincible > 0) player.invincible -= dt;
  if (player.hurtFlash  > 0) player.hurtFlash  -= dt;
  if (player.attackTimer > 0) player.attackTimer -= dt;

  // 玩家移动（v3 高响应 Lerp）
  if (!playerFrozen) {
    var rawX = joystick.dx;
    var rawY = joystick.dy;
    var mag = Math.hypot(rawX, rawY);

    // ★ 极低死区 3%
    var deadZone = 0.03;
    if (mag <= deadZone) { rawX = 0; rawY = 0; }
    else {
      // 二次响应曲线：低速细腻，高速灵敏
      var response = (mag - deadZone) / (1 - deadZone);
      response = response * response;  // quadratic
      var nx = rawX / mag;
      var ny = rawY / mag;
      rawX = nx * response;
      rawY = ny * response;
    }

    if (!player.isDashing) {
      // ★ 高响应 Lerp（40 = 0.075s 到 95%）
      var targetVx = rawX * player.speed;
      var targetVy = rawY * player.speed;
      var t = 1 - Math.exp(-40 * dt);

      // 首次输入瞬间：直接跳到最低速度，消除"起步迟钝"
      var wasStopped = (Math.abs(player.vx) < 1 && Math.abs(player.vy) < 1);
      if (wasStopped && (targetVx !== 0 || targetVy !== 0)) {
        player.vx = targetVx * 0.3;
        player.vy = targetVy * 0.3;
      } else {
        player.vx += (targetVx - player.vx) * t;
        player.vy += (targetVy - player.vy) * t;
      }

      player.x += player.vx * dt;
      player.y += player.vy * dt;
      if (Math.abs(player.vx) > 3 || Math.abs(player.vy) > 3) {
        var fa = Math.atan2(player.vy, player.vx);
        player.facing = Math.round(fa / (Math.PI / 4)) * (Math.PI / 4);  // ★ 8向
        player.walkFrame += dt * 10;
      } else {
        player.walkFrame = 0;
      }
      player.x = clamp(player.x, player.w/2, GW - player.w/2);
      player.y = clamp(player.y, player.h/2, GH - player.h/2);

      // 自动索敌（8方向）
      var nearest = null, nearestDist = 75;
      for (var j = 0; j < enemies.length; j++) {
        var en2 = enemies[j];
        if (en2.hp <= 0) continue;
        var d = dist(player, en2);
        if (d < nearestDist) { nearestDist = d; nearest = en2; }
      }
      if (nearest) {
        var fa = angleTo(player, nearest);
        player.facing = Math.round(fa / (Math.PI / 4)) * (Math.PI / 4);  // 8向
    }

    // 冲刺
    if (player.isDashing) {
      player.dashTimer -= dt;
      player.x += player.dashDx * player.speed * 2.8 * dt;
      player.y += player.dashDy * player.speed * 2.8 * dt;
      player.x = clamp(player.x, player.w/2, GW - player.w/2);
      player.y = clamp(player.y, player.h/2, GH - player.h/2);
      for (var k = 0; k < enemies.length; k++) {
        var en3 = enemies[k];
        if (en3.hp <= 0 || en3.hitstop > 0) continue;
        if (dist(player, en3) < 38) applyDamage(en3, 35, player.facing);
      }
      if (player.dashTimer <= 0) { player.isDashing = false; }
    }

    if (attackJustPressed && player.attackCD <= 0 && !player.isDashing) {
      player.attackCD = 0.3; player.attackTimer = 0.15;
      performAttack();
    }
    if (skillJustPressed && player.skillCD <= 0 && !player.isDashing) {
      player.skillCD = 3.0; player.isDashing = true; player.dashTimer = 0.18;
      player.dashDx = Math.cos(player.facing);
      player.dashDy = Math.sin(player.facing);
      player.vx = player.dashDx * player.speed * 0.5;
      player.vy = player.dashDy * player.speed * 0.5;
    }
  }
  attackJustPressed = false;
  skillJustPressed  = false;

  // 敌人更新
  for (var m = 0; m < enemies.length; m++) {
    var en = enemies[m];
    if (en.hp <= 0) continue;
    if (en.hitstop > 0) { en.hitstop -= dt; continue; }
    if (en.stun > 0) en.stun -= dt;
    if (en.flashTimer > 0) en.flashTimer -= dt;
    if (en.knockbackVx !== 0 || en.knockbackVy !== 0) {
      if (en.stun <= 0) {
        en.knockbackVx *= Math.pow(0.005, dt);
        en.knockbackVy *= Math.pow(0.005, dt);
        if (Math.abs(en.knockbackVx) < 3) en.knockbackVx = 0;
        if (Math.abs(en.knockbackVy) < 3) en.knockbackVy = 0;
      }
    }
    if (en.stun > 0) {
      en.x += en.knockbackVx * dt;
      en.y += en.knockbackVy * dt;
      en.x = clamp(en.x, en.w/2, GW - en.w/2);
      en.y = clamp(en.y, en.h/2, GH - en.h/2);
      continue;
    }
    var ang = angleTo(en, player);
    en.x += Math.cos(ang) * en.speed * dt + en.knockbackVx * dt;
    en.y += Math.sin(ang) * en.speed * dt + en.knockbackVy * dt;
    en.bounceT += dt * 6;  // 弹跳动画
    en.x = clamp(en.x, en.w/2, GW - en.w/2);
    en.y = clamp(en.y, en.h/2, GH - en.h/2);
    if (player.invincible <= 0 && dist(player, en) < (player.w + en.w) / 2 + 2) {
      player.hp -= 8;
      player.invincible = 0.4;
      player.hurtFlash = 0.15;
      var pa = angleTo(en, player);
      player.x += Math.cos(pa) * 10;
      player.y += Math.sin(pa) * 10;
    }
  }

  updateParticles(dt);
  updateDungeonDefense(dt);
}

function drawDungeonBackground() {
  // 深色石砖地面：使用固定算法纹理，避免每帧随机闪烁。

      if (v === 0) {
        g.fillStyle = '#171b29'; g.fillRect(tx+6, ty+7, 5, 1); g.fillRect(tx+10, ty+8, 1, 4);
      }
    }
  }
  // 外墙和内侧金属边框。
  g.fillStyle = '#0a0d16'; g.fillRect(0,0,GW,12); g.fillRect(0,GH-12,GW,12); g.fillRect(0,0,12,GH); g.fillRect(GW-12,0,12,GH);
  g.fillStyle = '#38405a'; g.fillRect(12,12,GW-24,3); g.fillRect(12,GH-15,GW-24,3); g.fillRect(12,12,3,GH-24); g.fillRect(GW-15,12,3,GH-24);
  // 两盏副本火把与柔和光晕。

    glow.addColorStop(0,'rgba(94,190,255,0.20)'); glow.addColorStop(1,'rgba(94,190,255,0)');
    g.fillStyle = glow; g.fillRect(lp.x-38,lp.y-38,76,76);
    g.fillStyle = '#283149'; g.fillRect(lp.x-4,lp.y-3,8,10);
    g.fillStyle = '#7ce7ff'; g.fillRect(lp.x-2,lp.y-7,4,6);

  }
}

// ============================================================
//  像素角色（元气骑士级精度 — 逐像素 fillRect 手绘）
//  骑士 4 方向 + 走路 · 史莱姆弹跳 + 三色 · 骷髅兵 / 蝙蝠
// ============================================================
function p(g, x, y, w, h, c) { if (c) { g.fillStyle = c; g.fillRect(x, y, w || 1, h || 1); } }

// 无头骑士（玩家）—— 8 方向 + 暗黑铠甲 + 大砍刀 + 断颈鬼火
function drawKnight(g, x, y, facing, walkFrame, hurtFlash, isDashing) {
  var a = facing; while (a < 0) a += Math.PI * 2;
  var dir = Math.round(a / (Math.PI / 4)) % 8;  // ★ 8 方向：0=右 1=右下 2=下 3=左下 4=左 5=左上 6=上 7=右上
  var fl = hurtFlash > 0 && (hurtFlash % 0.06 < 0.03);
  var wf = Math.floor(walkFrame) % 4; if (wf > 2) wf = 4 - wf;
  g.save(); g.translate(x, y);
  if (isDashing) { g.fillStyle = 'rgba(200,80,255,0.35)'; g.fillRect(-18, -19, 36, 36); }

  var A = fl?'#fff':'#1a1a2e', S = fl?'#fff':'#2a2a44', H = fl?'#fff':'#3a3a55';
  var R = fl?'#fff':'#884455', G = fl?'#fff':'#9922cc', L = fl?'#fff':'#77aaff';
  var B = fl?'#fff':'#111122', T = fl?'#fff':'#cccccc', D = fl?'#fff':'#888899';
  var K = fl?'#fff':'#664422', C = fl?'#fff':'#331144', O = fl?'#fff':'#dd8822';
  var Z = fl?'#fff':'#221133';  // 披风暗面

  // 方向分组：0,1,7=右向 · 2=正下 · 3,4,5=左向 · 6=正上
  var isSide = (dir !== 2 && dir !== 6);          // 侧视
  var isLeft = (dir >= 3 && dir <= 5);            // 朝左
  var isDiag = (dir === 1 || dir === 3 || dir === 5 || dir === 7); // 对角线
  var isVert = (dir === 2 || dir === 6);          // 正上/正下
  var isDown = (dir === 1 || dir === 2 || dir === 3);  // 下方分量
  var isUp   = (dir === 5 || dir === 6 || dir === 7);  // 上方分量

  if (isSide) {
    var f = isLeft ? -1 : 1;
    var la = Math.sin(wf * Math.PI / 2) * 3;
    // 破披风
    p(g, -7*f, -5, 6, 11, C); p(g, -6*f, -4, 4, 8, Z);
    // 后腿（对角线时偏移）
    var rl = isDiag ? (isUp ? -2 : 2) : 0;
    p(g, -3*f-la, 3+rl, 4, 5, A); p(g, -2*f-la, 5+rl, 3, 2, S);
    // 身体
    p(g, -5, -4, 10, 12, A);
    p(g, -4, -2, 5, 8, S); p(g, 1, -3, 3, 10, H);
    // 铆钉
    p(g, -3, -1, 1, 1, O); p(g, -3, 2, 1, 1, O); p(g, -3, 5, 1, 1, O);
    // 腰带
    p(g, -5, 6, 10, 2, B); p(g, -3, 6, 6, 1, R);
    // 肩甲
    p(g, -7, -3, 8, 5, A); p(g, -6, -2, 6, 3, S); p(g, 0, -3, 5, 4, H);
    // 断颈
    p(g, -3, -11, 6, 5, B);
    p(g, -3, -12, 2, 3, A); p(g, 2, -12, 2, 2, A);
    p(g, -1, -11, 2, 3, S);
    // 鬼火（对角线时偏移）
    var go = isDiag ? 1 : 0;
    p(g, -2+go*f, -16, 4, 4, G); p(g, -1+go*f, -17, 2, 5, L);
    p(g, -1+go*f, -15, 2, 1, 'rgba(200,150,255,0.7)');
    p(g, go*f, -19, 1, 3, 'rgba(180,220,255,0.6)');
    // 前腿
    var fl2 = isDiag ? (isDown ? 2 : isUp ? -2 : 0) : 0;
    p(g, 1*f+la, 3+fl2, 4, 5, A); p(g, 2*f+la, 5+fl2, 3, 3, H);
    // 大砍刀（对角线时角度微调）
    var dy = isDiag ? (isDown ? 1 : isUp ? -1 : 0) : 0;
    p(g, 1*f, -7, 3, 2, K);
    p(g, 3*f, -9+dy, 8, 3, T);
    p(g, 10*f, -10+dy, 2, 5, T);
    p(g, 5*f, -6, 4, 2, D);
  } else {
    // 正下(2) 或 正上(6)
    var fw = (dir === 6) ? -1 : 1;
    var l2 = Math.sin(wf * Math.PI / 2) * 2;
    p(g, -5, Math.min(-5*fw, 8*fw), 10, 5, C);
    p(g, -5, 3*fw+l2, 4, 5, A); p(g, 1, 3*fw-l2, 4, 5, A);
    var by = Math.min(-4*fw, 8*fw);
    p(g, -5, by, 10, 12, A); p(g, -3, by+2*fw, 6, 6, S);
    p(g, -3, by+1*fw, 1, 1, O); p(g, 2, by+1*fw, 1, 1, O);
    p(g, -7, by, 8, 4, A); p(g, -6, by+1*fw, 6, 2, S);
    var ny = by - 7*fw, nyt = Math.min(ny, ny+7*fw);
    p(g, -3, nyt, 6, 5, B); p(g, -2, nyt-1*fw, 2, 2, A);
    var gy = nyt - 4*fw, gyt = Math.min(gy, gy+4*fw);
    p(g, -2, gyt, 4, 4, G); p(g, -1, gyt-1*fw, 2, 3, L);
    p(g, 3, by+2*fw, 7, 3, T); p(g, 9, by+1*fw, 2, 5, T);
  }
  g.restore();
}

// 史莱姆 — 弹跳压扁 + 高光 + 眼瞳 + 嘴
function drawSlime(g, x, y, hpRatio, flashTimer, bounceT, colorVar) {
  var sq = 1 + Math.sin(bounceT) * 0.18, tl = 1 - Math.sin(bounceT) * 0.12;
  var flashOn = flashTimer > 0 && (flashTimer % 0.06 < 0.03);
  var clr = flashOn ? {b:'#fff',d:'#ddd',h:'#eee',o:'#f00'} :
    [{b:'#55cc44',d:'#339922',h:'#88ee66',o:'#fff'},
     {b:'#44aacc',d:'#226688',h:'#77ddee',o:'#fff'},
     {b:'#cc7744',d:'#884422',h:'#eeaa77',o:'#fff'}][colorVar % 3];

  g.save(); g.translate(x, y);
  // 地面阴影
  p(g, -7, 3, 14, 3, 'rgba(0,0,0,0.2)');
  // 身体主体
  var bw = Math.round(14*sq), bh = Math.round(13*tl);
  var by = -8 - Math.round((bh-13)/2);
  p(g, -bw/2, by, bw, bh, clr.b);
  // 底部暗色渐变
  p(g, -bw/2+2, by+bh-5, bw-4, 4, clr.d);
  // 高光（上半圆光斑）
  p(g, -bw/2+3, by+2, bw-6, 2, clr.h);
  p(g, -1, by+1, 3, 3, 'rgba(255,255,255,0.35)');
  // 眼睛
  p(g, -6, by+4, 3, 4, flashOn?'#f00':clr.o);
  p(g, 3, by+4, 3, 4, flashOn?'#f00':clr.o);
  // 瞳孔
  p(g, -5, by+5, 2, 2, flashOn?'#f00':'#113311');
  p(g, 4, by+5, 2, 2, flashOn?'#f00':'#113311');
  // 嘴
  if (!flashOn) {
    p(g, -2, by+bh-3, 4, hpRatio>0.3?2:1, '#226622');
  }
  // 血条
  p(g, -7, by-6, 14, 2, '#333');
  p(g, -7, by-6, Math.round(14*hpRatio), 2, hpRatio>0.5?'#4f4':hpRatio>0.25?'#fa0':'#f33');
  g.restore();
}

// ---- 骷髅兵 ----
function drawSkeleton(g, x, y, flashTimer, bounceT) {
  var flashOn = flashTimer > 0 && (flashTimer % 0.06 < 0.03);
  var bo = flashOn ? '#fff' : '#ddd8c8';
  g.save(); g.translate(x, y);
  // 头骨
  p(g, -4, -10, 8, 7, bo); p(g, -3, -11, 6, 2, bo);
  // 眼窝
  p(g, -3, -9, 2, 3, '#222'); p(g, 1, -9, 2, 3, '#222');
  // 肋骨
  p(g, -3, -3, 6, 5, bo); p(g, -4, -2, 8, 1, '#ccc8b8');
  p(g, -4, -1, 8, 1, '#ccc8b8');
  // 骨盆
  p(g, -2, 3, 4, 3, bo);
  // 腿
  var lb = Math.sin(bounceT||0) * 2;
  p(g, -3, 5, 2, 5, bo); p(g, 1, 5, 2, 5, bo);
  p(g, -3+lb, 9, 3, 2, '#999');
  // 微小手臂
  p(g, -7, -4, 3, 5, bo); p(g, 4, -4, 3, 5, bo);
  g.restore();
}

// ---- 蝙蝠 ----
function drawBat(g, x, y, bounceT) {
  var bw = Math.sin(bounceT||0) * 3;
  g.save(); g.translate(x, y);
  // 身体
  p(g, -2, -3, 4, 6, '#443355');
  // 翅膀
  p(g, -8+bw, -4, 6, 2, '#554466'); p(g, 2-bw, -4, 6, 2, '#554466');
  p(g, -6+bw, -2, 4, 4, '#665577'); p(g, 2-bw, -2, 4, 4, '#665577');
  // 眼睛
  p(g, -1, -2, 2, 2, '#ff4444');
  g.restore();
}

// ============================================================
//  渲染游戏世界
// ============================================================
function drawGameWorld() {
  g.clearRect(0, 0, GW, GH);
  drawDungeonBackground();

  // 固定副本阵地：地刺和魔晶史莱姆守卫。
  for (var ti = 0; ti < dungeon.traps.length; ti++) {
    var tr = dungeon.traps[ti];
    g.fillStyle = tr.cd > 0 ? '#503a56' : '#8c8ca0';
    for (var sp = -8; sp <= 8; sp += 8) {
      g.beginPath(); g.moveTo(tr.x+sp-3, tr.y+6); g.lineTo(tr.x+sp, tr.y-7); g.lineTo(tr.x+sp+3, tr.y+6); g.fill();
    }
  }
  for (var mi = 0; mi < dungeon.minions.length; mi++) {
    var mn = dungeon.minions[mi];
    if (mn.hp <= 0) continue;
    g.fillStyle = '#182b55'; g.beginPath(); g.arc(mn.x, mn.y+2, 10, 0, Math.PI*2); g.fill();
    g.fillStyle = '#38bfff'; g.beginPath(); g.arc(mn.x, mn.y-1, 7, Math.PI, 0); g.fill();
    g.fillStyle = '#d9f6ff'; g.fillRect(mn.x-4, mn.y-1, 2, 2); g.fillRect(mn.x+2, mn.y-1, 2, 2);
    g.fillStyle = '#222'; g.fillRect(mn.x-9, mn.y-13, 18, 3);
    g.fillStyle = '#57d7ff'; g.fillRect(mn.x-9, mn.y-13, 18*(mn.hp/mn.maxHp), 3);
  }

  if (gameOver) {
    g.fillStyle = 'rgba(0,0,0,0.75)';
    g.fillRect(0, 0, GW, GH);
    g.fillStyle = '#f44';
    g.font = 'bold 28px "Microsoft YaHei",sans-serif';
    g.textAlign = 'center';
    g.fillText('你 倒 下 了', GW/2, GH/2 - 12);
    g.fillStyle = '#fff';
    g.font = '12px "Microsoft YaHei",sans-serif';
    g.fillText(Math.ceil(gameOverTimer) + '秒后自动重来', GW/2, GH/2 + 22);
    g.fillText('点击屏幕立即重试', GW/2, GH/2 + 42);
    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      var alpha = p.life / p.maxLife;
      var rr = parseInt(p.color.slice(1,3),16), gg = parseInt(p.color.slice(3,5),16), bb = parseInt(p.color.slice(5,7),16);
      g.fillStyle = 'rgba('+rr+','+gg+','+bb+','+alpha+')';
      g.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    return;
  }

  // 敌人（史莱姆）
  for (var ei = 0; ei < enemies.length; ei++) {
    var en = enemies[ei];
    if (en.hp <= 0) continue;
    g.fillStyle = 'rgba(0,0,0,0.36)'; g.beginPath(); g.ellipse(en.x, en.y+8, 10, 4, 0, 0, Math.PI*2); g.fill();
    drawSlime(g, en.x, en.y, en.hp / en.maxHp, en.flashTimer, en.bounceT, en.colorVar);
  }

  // 玩家（骑士）
  g.fillStyle = 'rgba(0,0,0,0.48)'; g.beginPath(); g.ellipse(player.x, player.y+10, 12, 5, 0, 0, Math.PI*2); g.fill();
  drawKnight(g, player.x, player.y, player.facing, player.walkFrame, player.hurtFlash, player.isDashing);

  // 刀光
  if (player.attackTimer > 0) {
    g.save(); g.translate(player.x, player.y);
    var alpha = player.attackTimer / 0.15;
    g.fillStyle = 'rgba(255,255,255,'+(alpha*0.6)+')';
    g.beginPath(); g.moveTo(0,0);
    g.arc(0,0,35,player.facing-Math.PI/3, player.facing+Math.PI/3); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,220,80,'+(alpha*0.8)+')';
    g.beginPath(); g.moveTo(0,0);
    g.arc(0,0,25,player.facing-Math.PI/3.5, player.facing+Math.PI/3.5); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,'+alpha+')'; g.lineWidth = 2;
    g.beginPath();
    g.arc(0,0,30,player.facing-Math.PI/3.3, player.facing+Math.PI/3.3); g.stroke();
    g.restore();
  }

  // 冲刺特效
  if (player.isDashing) {
    g.save(); g.translate(player.x, player.y);
    for (var di = 1; di <= 4; di++) {
      var dtx = -Math.cos(player.facing) * di * 8;
      var dty = -Math.sin(player.facing) * di * 8;
      g.fillStyle = 'rgba(140,200,255,'+(0.25 - di * 0.05)+')';
      g.fillRect(dtx-player.w/2, dty-player.h/2, player.w, player.h);
    }
    g.strokeStyle = 'rgba(180,220,255,0.7)'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0,0); g.lineTo(Math.cos(player.facing)*35, Math.sin(player.facing)*35); g.stroke();
    g.restore();
  }

  // 粒子
  for (var pi2 = 0; pi2 < particles.length; pi2++) {
    var p2 = particles[pi2];
    var alpha2 = p2.life / p2.maxLife;
    var rr2 = parseInt(p2.color.slice(1,3),16), gg2 = parseInt(p2.color.slice(3,5),16), bb2 = parseInt(p2.color.slice(5,7),16);
    g.fillStyle = 'rgba('+rr2+','+gg2+','+bb2+','+alpha2+')';
    g.fillRect(p2.x-p2.size/2, p2.y-p2.size/2, p2.size, p2.size);
  }
}

// ============================================================
//  渲染 UI（v1 letterbox 方案）
// ============================================================
function drawUI() {
  ctx.clearRect(0, 0, sw, sh);

  // 背景
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, sw, sh);

  // 游戏画面（带震动偏移）
  ctx.save();
  ctx.translate(ox + shakeX, oy + shakeY);
  ctx.scale(scale, scale);
  ctx.drawImage(offscreen, 0, 0);
  ctx.restore();

  // 暗角
  var vg = ctx.createRadialGradient(sw/2, sh/2, sw*0.35, sw/2, sh/2, sw*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, sw, sh);

  // HUD
  var hudX = 14, hudY = 14;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(hudX-2, hudY-2, 124, 18);
  ctx.fillStyle = '#333';
  ctx.fillRect(hudX, hudY, 120, 14);
  var hpR = Math.max(0, player.hp) / 100;
  ctx.fillStyle = hpR > 0.5 ? '#4f4' : hpR > 0.25 ? '#fa0' : '#f33';
  ctx.fillRect(hudX, hudY, 120 * hpR, 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('HP ' + Math.max(0, player.hp) + '/100', hudX+60, hudY+11);

  // 摇杆底座
  var bjx = joystick.active ? joystick.baseX : joyBaseX;
  var bjy = joystick.active ? joystick.baseY : joyBaseY;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(bjx, bjy, JOY_RADIUS, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();

  // 摇杆头
  var sx2 = joystick.active ? joystick.stickX : bjx;
  var sy2 = joystick.active ? joystick.stickY : bjy;
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(sx2, sy2, JOY_RADIUS * 0.4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2; ctx.stroke();

  // 按钮
  drawButton(atkCX, atkCY, BTN_RADIUS_L, '普攻', '#e85', atkBtn.pressed);
  drawButton(skillCX, skillCY, BTN_RADIUS_S, '技', '#5af', skillBtn.pressed);

  // CD遮罩
  if (player.skillCD > 0) {
    var cdRatio = player.skillCD / 3.0;
    ctx.save();
    ctx.beginPath();
    ctx.arc(skillCX, skillCY, BTN_RADIUS_S, -Math.PI/2, -Math.PI/2 + Math.PI*2*cdRatio, false);
    ctx.lineTo(skillCX, skillCY); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.round(BTN_RADIUS_S*0.3) + 'px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(player.skillCD.toFixed(1)+'s', skillCX, skillCY + BTN_RADIUS_S + Math.round(BTN_RADIUS_S*0.4));
  }

  // 敌人计数
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  var alive = 0;
  for (var ci = 0; ci < enemies.length; ci++) { if (enemies[ci].hp > 0) alive++; }
  ctx.fillText('挑战者: ' + alive + '  |  下一批: ' + respawnQueue.length, sw-14, hudY+12);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8ee8ff';
  ctx.fillText('魔晶: ' + dungeon.crystals + '  守卫击杀: ' + dungeon.kills, 14, hudY+40);
}

function drawButton(cx, cy, r, label, color, pressed) {
  ctx.strokeStyle = pressed ? '#fff' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = pressed ? color : 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.arc(cx, cy, r-3, 0, Math.PI*2); ctx.fill();
  var rv=parseInt(color.slice(1,3),16), gv=parseInt(color.slice(3,5),16), bv=parseInt(color.slice(5,7),16);
  ctx.fillStyle = pressed ? 'rgba(255,255,255,0.25)' : 'rgba('+rv+','+gv+','+bv+',0.18)';
  ctx.beginPath(); ctx.arc(cx, cy, r-8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  var fs = Math.round(r * (label.length > 1 ? 0.34 : 0.38));
  ctx.font = 'bold ' + fs + 'px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy);
}

// ============================================================
//  重启
// ============================================================
function restartGame() {
  player.x = GW/2; player.y = GH/2; player.hp = 100; player.facing = 0;
  player.vx = 0; player.vy = 0; player.walkFrame = 0;
  player.attackCD = 0; player.attackTimer = 0; player.skillCD = 0;
  player.isDashing = false; player.dashTimer = 0;
  player.invincible = 0; player.hurtFlash = 0; player.hitstop = 0;
  enemies.length = 0; particles.length = 0; respawnQueue.length = 0;
  screenShake = 0; shakeX = 0; shakeY = 0; gameOver = false; gameOverTimer = 0;
  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
  atkBtn.pressed = false; skillBtn.pressed = false;
  joystick.baseX = joystick.stickX = joyBaseX;
  joystick.baseY = joystick.stickY = joyBaseY;
  for (var i = 0; i < MAX_ENEMIES; i++) enemies.push(spawnEnemy());
}

canvas.addEventListener('click', function() { if (gameOver) restartGame(); });
canvas.addEventListener('touchend', function(e) {
  if (gameOver && e.changedTouches.length > 0) restartGame();
});

// ============================================================
//  主循环
// ============================================================
var lastTime = performance.now();

function gameLoop(timestamp) {
  var dt = (timestamp - lastTime) / 1000;
  if (dt <= 0) dt = 1/60;
  lastTime = timestamp;

  if (gameOver && gameOverTimer <= 0) restartGame();

  for (var i = enemies.length-1; i >= 0; i--) {
    if (enemies[i].hp <= 0) enemies.splice(i, 1);
  }

  update(dt);

  // 仅横屏时渲染
  if (isLandscape) {
    drawGameWorld();
    drawUI();
  }

  requestAnimationFrame(gameLoop);
}

// 初始化摇杆默认位置
recalcUI();
joystick.baseX = joystick.stickX = joyBaseX;
joystick.baseY = joystick.stickY = joyBaseY;

requestAnimationFrame(gameLoop);

console.log('v7 ready');
</script>
